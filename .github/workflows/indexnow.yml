name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'frontend/index.html'
      - 'frontend/src/seo.ts'
      - 'frontend/src/pages/HomePage.tsx'
      - 'frontend/src/pages/InformationalPage.tsx'
      - 'frontend/public/og-image.svg'
      - 'frontend/public/sitemap.xml'
      - 'scripts/public-routes.mjs'
      - 'scripts/indexnow.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate sitemap
        run: npm run seo:generate
      - name: Notify IndexNow
        run: npm run seo:indexnow -- --submit
