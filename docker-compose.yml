services:
  postgres:
    image: postgres:16-alpine
    container_name: codeshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codeshare}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeshare-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codeshare?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@postgres:5432/codeshare?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/codeshare?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MAX_PASTE_SIZE_BYTES: ${MAX_PASTE_SIZE_BYTES:-524288}
      PASTE_EXPIRY_HOURS: 24
      CLEANUP_INTERVAL_MINUTES: 60
    ports:
      - "3000:3000"

volumes:
  pgdata:
